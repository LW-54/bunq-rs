[package]
name = "bunq-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A robust Rust client for private bunq API-key integrations"
repository = "https://github.com/lw/bunq-rs"
keywords = ["bunq", "banking", "api"]
categories = ["api-bindings"]
readme = "README.md"
homepage = "https://doc.bunq.com/"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.17", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }